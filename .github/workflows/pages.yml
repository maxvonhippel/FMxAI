name: Build, check and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build-args: "Fmxai fmxai Test"
      - name: Escape-hatch audit, tests, kernel re-check, site build
        run: scripts/check.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Publishes dist/ to GitHub Pages. The repository's Pages source must be set to
    # "GitHub Actions" (Settings → Pages); the CNAME in public/ keeps fmxai.org pointed here.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
