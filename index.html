<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMxAI 2026 — Formal Methods × AI Conference</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <meta name="description" content="FMxAI 2026, the Formal Methods × AI conference, June 1–3, 2026 at SRI Innovation Center, Menlo Park, CA.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --panel: #f6f7f9;
            --border: #e2e6ec;
            --text: #0e1726;
            --muted: #5b6573;
            --accent: #1b3a8a;
            --accent-soft: #2756c4;
            --eyebrow: #1b7a4a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-soft); text-decoration: underline; }

        .container { max-width: 1080px; margin: 0 auto; padding: 0 1.5rem; width: 100%; }

        header.site {
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
            flex-shrink: 0;
        }
        header.site .container {
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
        }
        header.site .brand {
            display: flex; align-items: center; gap: 0.6rem;
            font-weight: 600; color: var(--text);
        }
        header.site .brand img { width: 24px; height: 24px; }
        header.site .brand .sub {
            font-family: 'Source Serif 4', Georgia, serif;
            font-style: italic;
            font-weight: 400;
            color: var(--muted);
            font-size: 0.95rem;
            margin-left: 0.4rem;
        }
        header.site nav a {
            margin-left: 1.25rem; color: var(--muted); font-size: 0.95rem;
        }
        header.site nav a:hover { color: var(--accent); }

        .doc-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 1rem 0 0;
        }
        .doc-wrap .container {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }
        .doc-meta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            flex-wrap: wrap;
            padding: 0 0 0.75rem;
            color: var(--muted);
            font-size: 0.9rem;
        }
        .doc-meta .eyebrow {
            color: var(--eyebrow);
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-size: 0.8rem;
        }
        .doc-frame {
            flex: 1;
            min-height: 70vh;
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            background: var(--panel);
        }

        footer.site {
            padding: 1.25rem 0;
            color: var(--muted);
            font-size: 0.9rem;
            text-align: center;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <header class="site">
        <div class="container">
            <a class="brand" href="/">
                <img src="/favicon.png" alt="">
                <span>FMxAI 2026</span>
                <span class="sub">June 1–3 · SRI Innovation Center, Menlo Park</span>
            </a>
            <nav>
                <a href="https://docs.google.com/document/d/1SbRW-7qws0z7VHSQlhcVJoog3gix0FMmuDsa0z7jYk8/view" target="_blank" rel="noopener">Open in Docs ↗</a>
                <a href="/map/">Map</a>
            </nav>
        </div>
    </header>

    <main class="doc-wrap">
        <div class="container">
            <div class="doc-meta">
                <span class="eyebrow">Conference info &amp; agenda — live from Google Docs</span>
                <span>Last edits reflect within a few minutes.</span>
            </div>
            <iframe
                class="doc-frame"
                src="https://docs.google.com/document/d/1SbRW-7qws0z7VHSQlhcVJoog3gix0FMmuDsa0z7jYk8/preview"
                title="FMxAI 2026 conference info and agenda"
                loading="lazy">
            </iframe>
        </div>
    </main>

    <footer class="site">
        <div class="container">
            <a href="https://fmxai.org">fmxai.org</a> · <a href="https://github.com/maxvonhippel/FMxAI">source</a>
        </div>
    </footer>
</body>
</html>
